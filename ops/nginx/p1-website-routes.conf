# Inside the canonical website TLS server only. Replace its existing location /;
# keep the P0 exact robots/sitemap locations and all application/API vhosts.
location / {
    try_files $uri $uri/ =404;
}
error_page 404 /404.html;
location = /404.html {
    internal;
}
location = /release.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
