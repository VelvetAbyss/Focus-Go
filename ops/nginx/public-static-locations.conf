# Include inside BOTH nestflow.art and app.nestflow.art server blocks.
# The website document root is /var/www/focus-go/current/website;
# the app document root remains /var/www/focus-go/current.
# Exact matches prevent SPA/homepage fallback from swallowing crawl files.
location = /robots.txt {
    types { }
    default_type text/plain;
    try_files $uri =404;
}

location = /sitemap.xml {
    types { }
    default_type application/xml;
    try_files $uri =404;
}
