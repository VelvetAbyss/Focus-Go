name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core/contracts
        run: |
          npm run build --workspace @focus-go/core
          npm run build --workspace @focus-go/db-contracts

      - name: Run tests
        run: |
          npm run test --workspace @focus-go/core
          npm run test --workspace @focus-go/db-contracts
          npm run test --workspace @focus-go/web

      - name: Verify web build
        run: npm run verify
