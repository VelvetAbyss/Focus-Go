name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build --workspace @focus-go/core

      - name: Install API dependencies
        run: npm ci --prefix apps/web/focus-go-api

      - name: Run tests
        run: |
          npm run test --workspace @focus-go/core
          npm run test --workspace @focus-go/web
          npm test --prefix apps/web/focus-go-api
          npm run test --workspace @focus-go/obsidian-plugin

      - name: Verify web build
        run: npm run verify

      - name: Install smoke test browser
        run: npm exec --workspace @focus-go/web -- playwright install --with-deps chromium

      - name: Smoke test production build
        run: npm run test:smoke --workspace @focus-go/web
