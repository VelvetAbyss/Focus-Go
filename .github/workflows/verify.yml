name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core and contracts
        run: |
          npm run build --workspace @focus-go/core
          npm run build --workspace @focus-go/db-contracts

      - name: Install API dependencies
        run: npm ci --prefix apps/web/focus-go-api

      - name: Run tests
        run: |
          npm run test --workspace @focus-go/core
          npm run test --workspace @focus-go/db-contracts
          npm run test --workspace @focus-go/web -- --maxWorkers=2
          npm test --prefix apps/web/focus-go-api
          npm run test --workspace @focus-go/obsidian-plugin

      - name: Verify web build
        run: npm run verify

      - name: Install smoke test browser
        run: npm exec --workspace @focus-go/web -- playwright install --with-deps chromium

      - name: Smoke test production build
        run: npm run test:smoke --workspace @focus-go/web
