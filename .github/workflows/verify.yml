name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    # Pin the supported browser-test image; ubuntu-latest now selects 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core and contracts
        run: |
          npm run build --workspace @focus-go/core
          npm run build --workspace @focus-go/db-contracts

      - name: Install API dependencies
        run: npm ci --prefix apps/web/focus-go-api

      - name: Run tests
        run: |
          npm run test --workspace @focus-go/core
          npm run test --workspace @focus-go/db-contracts
          npm run test --workspace @focus-go/web -- --maxWorkers=2
          npm test --prefix apps/web/focus-go-api
          npm run test --workspace @focus-go/obsidian-plugin

      - name: Verify web build
        run: npm run verify

      - name: Install smoke test browser
        timeout-minutes: 8
        run: |
          # Azure's apt mirror can stall indefinitely before Playwright starts.
          # Keep Ubuntu signature verification and all browser checks enabled.
          grep -qF 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/zzzz-focusgo-ci >/dev/null
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          npm exec --workspace @focus-go/web -- playwright install --with-deps chromium

      - name: Smoke test production build
        run: npm run test:smoke --workspace @focus-go/web

      - name: Verify data safety and recovery in Chromium
        run: npm exec --workspace @focus-go/web -- playwright test --config playwright.sync-safety.config.ts
