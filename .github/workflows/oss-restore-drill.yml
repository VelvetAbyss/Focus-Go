name: OSS Restore Drill

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_NAME: focus-go
      OSS_PREFIX: releases
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install verified package-manager rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Resolve latest release pointer
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          node scripts/oss/resolve-latest-release.mjs > latest.env
          cat latest.env
          grep '^RELEASE_DATE=' latest.env >> "$GITHUB_ENV"
          grep '^GIT_SHA=' latest.env >> "$GITHUB_ENV"

      - name: Restore latest release from OSS
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/oss/restore-release.mjs

      - name: Validate restored package
        run: |
          test -f ".artifacts/restore/${APP_NAME}/${RELEASE_DATE}/${GIT_SHA}/manifest.json"
          test -f ".artifacts/restore/${APP_NAME}/${RELEASE_DATE}/${GIT_SHA}/apps/web/dist/index.html"
