name: Deploy to Production

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 1. Install dependencies (cached on CI) ──────────────────
      - name: Install dependencies
        run: npm ci

      # ── 2. Build web app on CI (fast machines, not the server) ──
      - name: Build web app
        run: npm run build:web
        env:
          VITE_API_BASE: https://api.nestflow.art
          VITE_REDIRECT_URI: https://app.nestflow.art/

      # ── 3. Pack dist into a single tarball ──────────────────────
      - name: Package dist
        run: tar czf dist.tar.gz -C apps/web/dist .

      # ── 4. Configure SSH ────────────────────────────────────────
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # StrictHostKeyChecking=no in ssh command, so no keyscan needed
          echo "SSH configured"

      # ── 5. Copy the verified build and deploy it ────────────────
      - name: Deploy on server
        timeout-minutes: 20
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          DIST_SHA256="$(sha256sum dist.tar.gz | cut -d' ' -f1)"
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            dist.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/dist-${GIT_SHA}.tar.gz"
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "DIST_SHA256='$DIST_SHA256' GIT_SHA='$GIT_SHA' GIT_AUTH_TOKEN='$GIT_AUTH_TOKEN' bash -s" << 'DEPLOY'
          set -euo pipefail

          echo "=== [1/3] verify and unpack dist ==="
          echo "${DIST_SHA256}  /tmp/dist-${GIT_SHA}.tar.gz" | sha256sum -c -
          mkdir -p "/tmp/focus-go-dist-${GIT_SHA}"
          tar xzf "/tmp/dist-${GIT_SHA}.tar.gz" -C "/tmp/focus-go-dist-${GIT_SHA}"
          rm -f "/tmp/dist-${GIT_SHA}.tar.gz"

          echo "=== [2/3] run deploy.sh ==="
          cd /root/focus-go
          git config --global --add safe.directory /root/focus-go
          ORIGINAL_ORIGIN="$(git remote get-url origin)"
          restore_origin() {
            git remote set-url origin "${ORIGINAL_ORIGIN}" 2>/dev/null || true
          }
          trap restore_origin EXIT
          git remote set-url origin "https://x-access-token:${GIT_AUTH_TOKEN}@github.com/VelvetAbyss/Focus-Go.git"
          PREVIOUS_DEPLOY_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          git reset --hard "${GIT_SHA}"
          PREVIOUS_DEPLOY_SHA="${PREVIOUS_DEPLOY_SHA}" DEPLOY_SKIP_GIT_FETCH=1 bash /root/focus-go/deploy.sh production "/tmp/focus-go-dist-${GIT_SHA}"

          echo "=== [3/3] deploy complete ==="
          DEPLOY
