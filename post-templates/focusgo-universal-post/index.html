<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus&Go Universal Post Template</title>
    <style>
      :root {
        --canvas-w: 1080px;
        --canvas-h: 1350px;
        --bg: #f5f3f0;
        --ink: #3a3733;
        --muted: #6c6760;
        --line: rgba(58, 55, 51, 0.14);
        --paper: #fbfaf7;
        --accent: #e6009a;
        --green: #215f55;
        --green-soft: #dce7e1;
        --shadow: 0 26px 72px rgba(58, 55, 51, 0.16);
        --display-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --body-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--bg), #cfc8be 22%);
        color: var(--ink);
        font-family: var(--body-font);
      }

      .poster {
        position: relative;
        width: min(100vw, var(--canvas-w));
        aspect-ratio: 4 / 5;
        overflow: hidden;
        background:
          radial-gradient(circle at 74% 22%, rgba(251, 250, 247, 0.8), transparent 32%),
          linear-gradient(180deg, rgba(251, 250, 247, 0.72), rgba(245, 243, 240, 0.96)),
          var(--bg);
        isolation: isolate;
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 72px;
        border: 1px solid rgba(58, 55, 51, 0.06);
        pointer-events: none;
      }

      .poster::after {
        content: "";
        position: absolute;
        right: -180px;
        top: 420px;
        width: 620px;
        height: 620px;
        border: 1px solid rgba(58, 55, 51, 0.1);
        border-radius: 50%;
        pointer-events: none;
      }

      .kicker {
        position: absolute;
        top: 46px;
        left: 76px;
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--accent);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .kicker-mark {
        width: 18px;
        height: 14px;
        background:
          linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 7px, var(--accent) 7px 18px),
          linear-gradient(var(--accent), var(--accent));
        background-size:
          18px 14px,
          18px 3px;
        background-position:
          0 0,
          0 11px;
        background-repeat: no-repeat;
      }

      .content {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 118px 86px 54px;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
      }

      .title {
        width: 840px;
        margin: 0;
        color: var(--ink);
        font-family: var(--display-font);
        font-size: 102px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: 0;
        text-wrap: balance;
        white-space: pre-line;
      }

      .title[data-density="medium"] {
        font-size: 88px;
        line-height: 1.12;
      }

      .title[data-density="long"] {
        font-size: 74px;
        line-height: 1.16;
      }

      .summary {
        margin: 46px 0 28px;
        max-width: 680px;
        color: var(--ink);
        font-size: 25px;
        font-weight: 500;
        line-height: 1.8;
        letter-spacing: 0.01em;
        white-space: pre-line;
      }

      .feature {
        align-self: end;
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
        margin-bottom: 24px;
      }

      .visual-card {
        position: relative;
        height: 342px;
        border-radius: 28px;
        background: var(--paper);
        border: 1px solid rgba(58, 55, 51, 0.08);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .visual-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(251, 250, 247, 0.1), rgba(245, 243, 240, 0.54)),
          radial-gradient(circle at 78% 35%, rgba(33, 95, 85, 0.1), transparent 34%);
        pointer-events: none;
      }

      .visual-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: saturate(0.9) contrast(0.97);
      }

      .quote-card {
        display: none;
        min-height: 342px;
        padding: 44px 52px;
        border-radius: 28px;
        background: var(--paper);
        border: 1px solid rgba(58, 55, 51, 0.08);
        box-shadow: var(--shadow);
      }

      .quote-mark {
        color: var(--green);
        font-size: 32px;
        font-weight: 900;
      }

      .quote-text {
        margin: 22px 0 0;
        color: var(--ink);
        font-size: 38px;
        font-weight: 800;
        line-height: 1.44;
        white-space: pre-line;
      }

      .points {
        display: none;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      .point {
        min-height: 186px;
        padding: 24px 22px;
        border-top: 2px solid var(--ink);
        background: rgba(251, 250, 247, 0.58);
      }

      .point-index {
        display: block;
        color: var(--green);
        font-size: 18px;
        font-weight: 900;
      }

      .point-text {
        display: block;
        margin-top: 22px;
        color: var(--ink);
        font-size: 24px;
        font-weight: 800;
        line-height: 1.35;
      }

      .poster[data-layout="quote"] .visual-card,
      .poster[data-layout="quote"] .points,
      .poster[data-layout="list"] .visual-card,
      .poster[data-layout="list"] .quote-card {
        display: none;
      }

      .poster[data-layout="quote"] .quote-card {
        display: block;
      }

      .poster[data-layout="list"] .points {
        display: grid;
      }

      .footer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 32px;
        align-items: end;
        padding-top: 18px;
        border-top: 1px solid rgba(58, 55, 51, 0.12);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: 9px;
      }

      .brand-name {
        margin: 0;
        color: var(--ink);
        font-size: 23px;
        font-weight: 900;
        line-height: 1.05;
      }

      .brand-tagline {
        margin: 5px 0 0;
        color: var(--ink);
        font-size: 21px;
        font-weight: 900;
        line-height: 1.05;
      }

      .cta {
        margin: 0;
        color: var(--muted);
        font-size: 22px;
        font-weight: 900;
        line-height: 1.06;
        text-align: right;
        text-transform: uppercase;
      }

      .cta strong {
        display: block;
        color: var(--ink);
        font-size: 24px;
      }

      @media (max-width: 720px) {
        body {
          place-items: start;
        }

        .poster {
          width: 100vw;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster" data-layout="image" aria-label="Focus&Go universal social post template">
      <div class="kicker">
        <span class="kicker-mark" aria-hidden="true"></span>
        <span data-field="kicker"></span>
      </div>

      <section class="content">
        <h1 class="title" data-field="title"></h1>
        <p class="summary" data-field="summary"></p>

        <section class="feature" aria-label="Post visual content">
          <figure class="visual-card">
            <img class="visual-image" data-field="image" alt="" />
          </figure>

          <article class="quote-card">
            <div class="quote-mark">FOCUS</div>
            <p class="quote-text" data-field="quote"></p>
          </article>

          <div class="points" data-field="points"></div>
        </section>

        <footer class="footer">
          <div class="brand">
            <img class="logo" data-field="logo" alt="" />
            <div>
              <p class="brand-name" data-field="brandName"></p>
              <p class="brand-tagline" data-field="brandTagline"></p>
            </div>
          </div>
          <p class="cta">
            <span data-field="ctaLabel"></span>
            <strong data-field="cta"></strong>
          </p>
        </footer>
      </section>
    </main>

    <script>
      window.POST_DATA = {
        layout: "image",
        kicker: "第一版",
        title: "先让开始\n变得容易一点",
        summary: "Focus&Go 是一个低阻力执行系统。\n从任务、专注、记录到复盘，\n把一天放回一个安静的界面里。",
        quote: "真正的问题不是不努力，\n而是开始的阻力太高。",
        points: ["写下今天要推进的事", "打开专注而不是切换工具", "结束后自动进入复盘"],
        brandName: "Focus&Go",
        brandTagline: "低阻力执行系统",
        ctaLabel: "访问官网",
        cta: "WWW.NESTFLOW.ART",
        logo: "./assets/focusgo-logo.png",
        image: "./assets/product-preview.jpg",
      };

      const data = { ...window.POST_DATA };
      const params = new URLSearchParams(window.location.search);
      params.forEach((value, key) => {
        data[key] = key === "points" ? value.split("|").filter(Boolean) : value;
      });

      const poster = document.querySelector(".poster");
      const title = document.querySelector(".title");
      poster.dataset.layout = data.layout || "image";

      document.querySelectorAll("[data-field]").forEach((node) => {
        const key = node.dataset.field;
        const value = data[key] || "";

        if (key === "points") {
          const points = Array.isArray(value) ? value : String(value).split("|").filter(Boolean);
          node.innerHTML = points
            .slice(0, 3)
            .map(
              (point, index) =>
                `<article class="point"><span class="point-index">0${index + 1}</span><span class="point-text">${escapeHtml(
                  point,
                )}</span></article>`,
            )
            .join("");
          return;
        }

        if (node instanceof HTMLImageElement) {
          node.src = value;
          node.alt = data[`${key}Alt`] || "";
          return;
        }

        node.textContent = value;
      });

      const titleLength = String(data.title || "").replace(/\s/g, "").length;
      title.dataset.density = titleLength > 28 ? "long" : titleLength > 18 ? "medium" : "short";

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    </script>
  </body>
</html>
